<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مدينة الحكمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0806;--card:#120f0a;--card2:#1a1410;--border:#2a2018;--gold:#c9a84c;--gold2:#e8c878;--cream:#f0e6c8;--muted:#7a6a50;--red:#8b1a1a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;direction:rtl}
.bg-o{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.07) 0%,transparent 60%)}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 0 90px}
.hdr{text-align:center;padding:22px 16px 16px;border-bottom:1px solid rgba(201,168,76,.15)}
.hdr-bsm{font-size:15px;color:var(--gold);margin-bottom:10px;font-family:'Amiri',serif}
.hdr-title{font-family:'Amiri',serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:4px}
.hdr-cnt{display:inline-block;margin-top:10px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:999px;padding:5px 18px;font-size:12px;color:var(--gold)}
.srch-w{padding:12px 16px 0}
.srch-b{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.srch-b input{flex:1;background:transparent;border:none;outline:none;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--cream);direction:rtl}
.srch-b input::placeholder{color:var(--muted)}
.page{display:none}.page.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec-t{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:15px;font-weight:900;color:var(--cream)}
.sec-t::before{content:'';width:3px;height:15px;background:var(--gold);border-radius:2px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.ic{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 12px;cursor:pointer;transition:all .2s;text-align:center}
.ic:hover,.ic:active{border-color:var(--gold);background:var(--card2)}
.ic-sym{font-size:28px;color:var(--gold);margin-bottom:8px;height:36px;display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif}
.ic-nm{font-size:12px;font-weight:700;color:var(--gold);line-height:1.5}
.ic-cn{font-size:10px;color:var(--muted);margin-top:3px}
.daily-c{margin:12px 16px;background:linear-gradient(135deg,#0d1008,#100d08);border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:20px;position:relative;overflow:hidden}
.daily-c::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.dc-lbl{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:10px}
.dc-txt{font-family:'Amiri',serif;font-size:18px;line-height:2;color:var(--cream)}
.dc-p{font-size:12px;color:var(--gold);margin-top:10px;font-weight:700}
.dc-a{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dc-b{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:6px 14px;font-family:'Tajawal',sans-serif;font-size:12px;color:var(--gold);cursor:pointer}
.dc-b:active{background:rgba(201,168,76,.18)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-v{font-size:26px;font-weight:900;color:var(--gold)}
.stat-l{font-size:11px;color:var(--muted);margin-top:4px}
.wl-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.back-b{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:7px 14px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.wl-nm{font-size:14px;font-weight:900;color:var(--gold);text-align:left;max-width:60%;line-height:1.3}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:0 16px 12px;padding:16px 16px 14px 36px;position:relative}
.wnum{position:absolute;top:14px;left:12px;width:22px;height:22px;border-radius:50%;background:rgba(201,168,76,.1);color:var(--gold);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.wtxt{font-family:'Amiri',serif;font-size:16px;line-height:1.9;color:var(--cream)}
.wa{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.wab{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:5px 12px;font-family:'Tajawal',sans-serif;font-size:11px;color:var(--gold);cursor:pointer}
.wab.on{background:rgba(139,26,26,.15);border-color:rgba(139,26,26,.3);color:#e88}
.fav-e{text-align:center;padding:60px 20px;color:var(--muted)}
.fav-e .ico{font-size:44px;margin-bottom:12px;font-family:'Amiri',serif;color:var(--gold)}
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,8,6,.97);border-top:1px solid rgba(201,168,76,.15);display:flex;max-width:600px;margin:0 auto;padding:6px 0 10px;backdrop-filter:blur(12px)}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;cursor:pointer;padding:4px}
.bnav-ic{font-size:22px;transition:transform .2s}
.bnav-lb{font-family:'Tajawal',sans-serif;font-size:10px;color:var(--muted)}
.bnav.on .bnav-lb{color:var(--gold)}
.bnav.on .bnav-ic{transform:scale(1.15)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--gold);color:var(--bg);padding:9px 22px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none}
.toast.s{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="bg-o"></div>
<div class="wrap">

<div class="hdr">
  <div class="hdr-bsm">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
  <div class="hdr-title">مدينة الحكمة</div>
  <div class="hdr-sub">حكم ومواعظ أهل البيت عليهم السلام</div>
  <div class="hdr-cnt">1000 حكمة</div>
</div>

<div class="page on" id="pg-home">
  <div class="srch-w">
    <div class="srch-b">
      <span style="color:var(--muted)">&#9906;</span>
      <input type="text" id="srch" placeholder="بحث في الحكم..." oninput="doSrch()">
    </div>
  </div>
  <div id="srch-res" style="display:none;padding-top:8px"></div>
  <div id="home-main">
    <div class="daily-c" id="daily-c">
      <div class="dc-lbl">✦ حكمة اليوم</div>
      <div class="dc-txt" id="dw-t">...</div>
      <div class="dc-p" id="dw-p"></div>
      <div class="dc-a">
        <button class="dc-b" onclick="rnd()">&#9654; أخرى</button>
        <button class="dc-b" onclick="cpDW()">نسخ</button>
        <button class="dc-b" onclick="savDW()">حفظ ♡</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-v">1000</div><div class="stat-l">إجمالي الحكم</div></div>
      <div class="stat"><div class="stat-v" id="s-fav">0</div><div class="stat-l">المحفوظة</div></div>
      <div class="stat"><div class="stat-v">14</div><div class="stat-l">معصوم</div></div>
      <div class="stat"><div class="stat-v" id="s-rd">0</div><div class="stat-l">مقروءة</div></div>
    </div>
    <div class="sec-t">اختر الإمام</div>
    <div class="ig" id="ig-home"></div>
  </div>
</div>

<div class="page" id="pg-browse">
  <div class="srch-w" style="padding-bottom:8px">
    <div class="srch-b">
      <span style="color:var(--muted)">&#9906;</span>
      <input type="text" id="srch2" placeholder="بحث في الحكم..." oninput="doSrch2()">
    </div>
  </div>
  <div id="br-grid">
    <div class="sec-t">اختر الإمام</div>
    <div class="ig" id="ig-browse"></div>
  </div>
  <div id="br-list" style="display:none">
    <div class="wl-hdr">
      <button class="back-b" onclick="backG()">&#8594; رجوع</button>
      <div class="wl-nm" id="wl-nm"></div>
    </div>
    <div id="wl-cards"></div>
  </div>
  <div id="br-srch" style="display:none">
    <div style="padding:10px 16px 6px;font-size:13px;color:var(--muted)" id="br-srch-t"></div>
    <div id="br-srch-cards"></div>
  </div>
</div>

<div class="page" id="pg-favs">
  <div class="sec-t">المحفوظة ♡</div>
  <div id="fav-list"></div>
</div>

<div class="bot-nav">
  <button class="bnav on" id="bn-home" onclick="gp('home')">
    <div class="bnav-ic">&#127968;</div>
    <div class="bnav-lb">الرئيسية</div>
  </button>
  <button class="bnav" id="bn-browse" onclick="gp('browse')">
    <div class="bnav-ic">&#128255;</div>
    <div class="bnav-lb">الحكم</div>
  </button>
  <button class="bnav" id="bn-favs" onclick="gp('favs')">
    <div class="bnav-ic">&#10084;</div>
    <div class="bnav-lb">المحفوظة</div>
  </button>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
function b64d(s){var b=atob(s.trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
var WS=JSON.parse(b64d(document.getElementById('dws').textContent));
var PS=JSON.parse(b64d(document.getElementById('dps').textContent));
var SYMS=['&#10022;','&#9670;','&#10047;','&#10059;','&#9673;','&#10048;','&#9730;','&#10036;','&#10023;','&#9678;','&#9729;','&#10050;','&#10046;','&#9672;'];
var favs=JSON.parse(localStorage.getItem('hk3_favs')||'[]');
var rdcnt=parseInt(localStorage.getItem('hk3_rd')||'0');
var curI=null;

function init(){buildGrids();initDaily();updStats();}
function initDaily(){var i=Math.floor(Date.now()/86400000)%WS.length;showDaily(i);}
function showDaily(i){document.getElementById('dw-t').textContent=WS[i].t;document.getElementById('dw-t')._i=i;document.getElementById('dw-p').textContent='— '+WS[i].p;}
function rnd(){showDaily(Math.floor(Math.random()*WS.length));}
function cpDW(){doCp(document.getElementById('dw-t').textContent+'\n\n'+document.getElementById('dw-p').textContent+'\n\nمدينة الحكمة');toast('تم النسخ');}
function savDW(){togFavI(document.getElementById('dw-t')._i||0);}
function doCp(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(function(){fbCp(txt);});}else fbCp(txt);}
function fbCp(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

function buildGrids(){
  var h=PS.map(function(p,i){
    var cnt=WS.filter(function(w){return w.p===p;}).length;
    var sn=p.replace('الإمام ','').replace('السيدة ','').replace('النبي ','').replace(' عليه السلام','').replace(' عليها السلام','').replace(' صلى الله عليه وآله','');
    return '<div class="ic" data-pi="'+i+'" onclick="showImam(parseInt(this.dataset.pi))"><div class="ic-sym">'+SYMS[i%SYMS.length]+'</div><div class="ic-nm">'+sn+'</div><div class="ic-cn">'+cnt+' حكمة</div></div>';
  }).join('');
  var g1=document.getElementById('ig-home');var g2=document.getElementById('ig-browse');
  if(g1)g1.innerHTML=h;if(g2)g2.innerHTML=h;
}
function showImam(idx){
  curI=idx;var ws=WS.filter(function(w){return w.p===PS[idx];});
  var sn=PS[idx].replace('الإمام ','').replace('السيدة ','').replace('النبي ','').replace(' عليه السلام','').replace(' عليها السلام','').replace(' صلى الله عليه وآله','');
  document.getElementById('wl-nm').textContent=sn;
  renderWC('wl-cards',ws,false);
  rdcnt+=ws.length;localStorage.setItem('hk3_rd',rdcnt);updStats();
  document.getElementById('br-grid').style.display='none';
  document.getElementById('br-list').style.display='block';
  document.getElementById('br-srch').style.display='none';
  gp('browse');
}
function backG(){document.getElementById('br-grid').style.display='block';document.getElementById('br-list').style.display='none';document.getElementById('br-srch').style.display='none';document.getElementById('srch2').value='';curI=null;}
function cardH(w,i,sp){
  var gi=WS.indexOf(w);if(gi<0)gi=0;
  var isFav=favs.some(function(f){return f.t===w.t;});
  return '<div class="wcard"><div class="wnum">'+(i+1)+'</div><div class="wtxt">'+w.t+'</div>'
    +(sp?'<div style="font-size:11px;color:var(--muted);margin-top:6px">— '+w.p+'</div>':'')
    +'<div class="wa"><button class="wab'+(isFav?' on':'')+'" data-gi="'+gi+'" onclick="togFavBtn(this)">'+(isFav?'♥ محفوظ':'♡ حفظ')+'</button>'
    +'<button class="wab" data-gi="'+gi+'" onclick="cpWBtn(this)">نسخ</button></div></div>';
}
function renderWC(el,ws,sp){document.getElementById(el).innerHTML=ws.map(function(w,i){return cardH(w,i,sp);}).join('');}
function togFavBtn(btn){
  var i=parseInt(btn.dataset.gi);var w=WS[i];
  var pos=favs.findIndex(function(f){return f.t===w.t;});
  if(pos>-1){favs.splice(pos,1);btn.textContent='♡ حفظ';btn.classList.remove('on');toast('تمت الإزالة');}
  else{favs.push(w);btn.textContent='♥ محفوظ';btn.classList.add('on');toast('تم الحفظ');}
  localStorage.setItem('hk3_favs',JSON.stringify(favs));updStats();
}
function togFavI(i){var w=WS[i];var pos=favs.findIndex(function(f){return f.t===w.t;});if(pos>-1){favs.splice(pos,1);toast('تمت الإزالة');}else{favs.push(w);toast('تم الحفظ');}localStorage.setItem('hk3_favs',JSON.stringify(favs));updStats();}
function cpWBtn(btn){var w=WS[parseInt(btn.dataset.gi)];doCp(w.t+'\n\n— '+w.p+'\n\nمدينة الحكمة');toast('تم النسخ');}
var st1,st2;
function doSrch(){
  var q=document.getElementById('srch').value.trim();clearTimeout(st1);
  if(!q){document.getElementById('srch-res').style.display='none';document.getElementById('home-main').style.display='block';return;}
  st1=setTimeout(function(){
    var res=WS.filter(function(w){return w.t.indexOf(q)>-1||w.p.indexOf(q)>-1;});
    document.getElementById('home-main').style.display='none';
    var el=document.getElementById('srch-res');el.style.display='block';
    el.innerHTML='<div style="padding:6px 16px;font-size:12px;color:var(--muted)">'+res.length+' نتيجة</div>'+res.slice(0,40).map(function(w,i){return cardH(w,i,true);}).join('');
  },350);
}
function doSrch2(){
  var q=document.getElementById('srch2').value.trim();clearTimeout(st2);
  if(!q){document.getElementById('br-srch').style.display='none';if(curI!==null)document.getElementById('br-list').style.display='block';else document.getElementById('br-grid').style.display='block';return;}
  st2=setTimeout(function(){
    var src=curI!==null?WS.filter(function(w){return w.p===PS[curI];}):WS;
    var res=src.filter(function(w){return w.t.indexOf(q)>-1;});
    document.getElementById('br-grid').style.display='none';document.getElementById('br-list').style.display='none';
    document.getElementById('br-srch').style.display='block';
    document.getElementById('br-srch-t').textContent=res.length+' نتيجة';
    renderWC('br-srch-cards',res.slice(0,50),curI===null);
  },350);
}
function renderFavs(){
  if(!favs.length){document.getElementById('fav-list').innerHTML='<div class="fav-e"><div class="ico">♡</div><div>لا توجد حكم محفوظة</div><div style="font-size:12px;margin-top:6px">اضغط حفظ على أي حكمة</div></div>';return;}
  document.getElementById('fav-list').innerHTML=favs.map(function(w,i){
    return '<div class="wcard"><div class="wnum">'+(i+1)+'</div><div class="wtxt">'+w.t+'</div><div style="font-size:11px;color:var(--muted);margin-top:6px">— '+w.p+'</div>'
    +'<div class="wa"><button class="wab on" data-ri="'+i+'" onclick="rmFav(this)">♥ إزالة</button><button class="wab" data-ri="'+i+'" onclick="cpFavR(this)">نسخ</button></div></div>';
  }).join('');
}
function rmFav(btn){favs.splice(parseInt(btn.dataset.ri),1);localStorage.setItem('hk3_favs',JSON.stringify(favs));updStats();renderFavs();toast('تمت الإزالة');}
function cpFavR(btn){var w=favs[parseInt(btn.dataset.ri)];doCp(w.t+'\n\n— '+w.p);toast('تم النسخ');}
function updStats(){document.getElementById('s-fav').textContent=favs.length;document.getElementById('s-rd').textContent=rdcnt;}
function gp(p){document.querySelectorAll('.page').forEach(function(e){e.classList.remove('on');});document.querySelectorAll('.bnav').forEach(function(e){e.classList.remove('on');});document.getElementById('pg-'+p).classList.add('on');document.getElementById('bn-'+p).classList.add('on');if(p==='favs')renderFavs();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast s';setTimeout(function(){t.classList.remove('s');},2200);}
window.addEventListener('load',init);
</script>
</body>
